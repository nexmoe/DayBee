name: Desktop checks and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: darwin-arm64}
          - {os: macos-15-intel, target: darwin-amd64}
          - {os: windows-latest, target: windows-amd64}
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -mod=mod
      DAYBEE_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: apps/desktop/go.sum
      - uses: actions/setup-node@v5
        with: {node-version: "24"}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.2"}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make diffutils
      - name: Select native C compiler
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
            echo 'CC=gcc' >> "$GITHUB_ENV"
            echo 'CXX=g++' >> "$GITHUB_ENV"
          else
            echo 'CC=clang' >> "$GITHUB_ENV"
            echo 'CXX=clang++' >> "$GITHUB_ENV"
            echo 'MACOSX_DEPLOYMENT_TARGET=13.3' >> "$GITHUB_ENV"
          fi
      - run: bun install --frozen-lockfile
      - run: bun run check:docs
      - name: Generate bindings and verify unchanged contract
        working-directory: apps/desktop
        run: bun run generate
      - run: git diff --exit-code -- apps/desktop/src/renderer/src/generated/mygo.ts packages/shared/src/defaults.ts
      - run: bun run typecheck && bun run test
      - run: bun run --cwd apps/desktop test:release
      - run: bun run --cwd apps/desktop test:race
      - name: Vet
        working-directory: apps/desktop
        run: node scripts/desktop.mjs vet
      - name: Import signing credentials for releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CERT_P12_BASE64: ${{ secrets.WIN_CERT_P12_BASE64 }}
        run: node apps/desktop/scripts/signing.mjs
      - name: Build native app and signed updates
        working-directory: apps/desktop
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
          MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERT_P12_PASSWORD }}
        run: bun run build
      - name: Native window smoke
        working-directory: apps/desktop
        run: bun run test:native
      - name: Renderer integration with native Go service
        working-directory: apps/desktop
        run: bunx playwright install chromium && bun run test:e2e
      - name: Verify bundled native dependencies
        working-directory: apps/desktop
        run: node scripts/verify-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: daybee-${{ matrix.target }}
          path: apps/desktop/dist/${{ matrix.target }}/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "24"}
      - name: Enforce UI, native inference, minimum OS and endurance acceptance
        run: node apps/desktop/scripts/release-gates.mjs
      - uses: actions/download-artifact@v4
        with: {pattern: daybee-*, path: artifacts}
      - name: Collect installers, signed updates and checksums
        run: node apps/desktop/scripts/collect-release.mjs artifacts dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*Setup*.exe
            dist/*.tar.gz
            dist/*.delta
            dist/update-*.json
            dist/SHA256SUMS.txt
          generate_release_notes: true
